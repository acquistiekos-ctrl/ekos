<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Catalogo EKOS Coatings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: libro a due pagine A4 (794x1122 px) con sfoglio 3D; pagina singola su schermi stretti; stampa piana A4. */
:root{
  --paper:#F7F6F2; --stone:#E7E5DF; --ink:#292D2B; --sage:#788675; --mid:#777A75; --dk:#3a3e43;
  --stage:#ECEAE4; --ui-fg:#292D2B; --ui-btn:#F7F6F2; --shadow:rgba(41,45,43,.28);
  --f:"Inter","Inter Display",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#1c1f1d;--ui-fg:#ecebe6;--ui-btn:#2a2e2b;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--stage:#1c1f1d;--ui-fg:#ecebe6;--ui-btn:#2a2e2b;--shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--ui-fg);font-family:var(--f);margin:0;overflow:hidden}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#fit{position:relative}
#scaler{position:absolute;left:0;top:0;transform-origin:0 0}
#book{position:relative;width:1588px;height:1122px;perspective:3200px;transition:transform .7s cubic-bezier(.5,.1,.2,1)}
.leaf{position:absolute;left:794px;top:0;width:794px;height:1122px;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.25,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(41,45,43,.14),rgba(41,45,43,0) 7%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(41,45,43,.14),rgba(41,45,43,0) 7%)}
#book::before{content:"";position:absolute;inset:6px 0 -10px 0;box-shadow:0 30px 60px -10px var(--shadow);pointer-events:none}
#single{display:none;position:relative}
#single .pg{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 18px 40px -12px var(--shadow)}
#bar{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:14px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#bar button{font:500 13px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--ui-fg);background:var(--ui-btn);border:0;border-radius:2px;padding:12px 18px;cursor:pointer}
#bar button:disabled{opacity:.35;cursor:default}
#bar button:focus-visible,.toc a:focus-visible{outline:2px solid #788675;outline-offset:2px}
#count{font:400 13px/1 var(--f);letter-spacing:.08em;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
#print{display:none}

/* ---------- pagina ---------- */
.pg{width:794px;height:1122px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;font-family:var(--f);font-size:12.5px;line-height:1.5;padding:68px 56px 74px;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg *{margin:0}
.pg img{display:block;max-width:none}
.pg a{color:inherit;text-decoration:none}
.folio{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500}
.ttl{font-weight:200;font-size:46px;line-height:1.02;letter-spacing:-.025em;margin-top:10px;text-wrap:balance}
.lead{margin-top:14px;max-width:560px;font-size:13px;line-height:1.55;color:#4b4f4b;text-wrap:pretty}
.hd{flex:none}
.grp{margin-top:18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:500;display:flex;align-items:center;gap:10px;flex:none}
.grp::before{content:"";width:12px;height:12px;background:var(--sage);display:block}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:10px;flex:none}
.pr{display:flex;gap:18px;align-items:stretch;min-height:64px}
.lgt{width:176px;flex:none;background:var(--stone);display:flex;align-items:center;justify-content:center;padding:8px 14px;overflow:hidden}
.lgt.dk{background:var(--dk)}
.lgt img{max-height:46px;max-width:100%;width:auto;height:auto;object-fit:contain}
.lgt.ph{padding:0;width:230px;background:none;align-self:flex-start}
.lgt.ph img{width:100%;height:auto;max-height:none;max-width:none}
.lgt .nmx{font-weight:500;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.25}
.wmk{font-weight:800;font-size:22px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.ds{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-block:2px}
.ds .tp{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);font-weight:500}
.ds p{font-size:11.5px;line-height:1.45;color:#3d413e;text-wrap:pretty}
.ds .fm{font-size:10.5px;color:var(--mid)}
.sch{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:600;margin-top:1px}
.sch.off{color:#a3a69f}
.big .lgt{width:196px}
.photos{flex:none;margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.fr{display:flex;gap:8px;align-items:flex-start}
.fr figure{position:relative;line-height:0;min-width:0}
.fr img{width:100%;height:auto}
.fr figcaption{line-height:1.4}
.fr figcaption,.pa figcaption{display:none!important;position:absolute;left:0;bottom:0;background:rgba(247,246,242,.92);padding:4px 9px;font-size:9px;letter-spacing:.08em;color:#3d413e}
.toc{display:flex;flex-direction:column;margin-top:22px}
.toc a{display:flex;align-items:baseline;gap:18px;padding-block:9px;color:inherit;cursor:pointer}
.toc a:hover b{color:var(--sage)}
.toc em{font-style:normal;width:30px;font-size:10.5px;letter-spacing:.14em;color:var(--mid);font-variant-numeric:tabular-nums}
.toc b{font-weight:300;font-size:23px;letter-spacing:-.015em}
.toc span{margin-left:auto;font-size:10.5px;color:var(--mid);text-align:right;max-width:250px}
.mark{font-weight:500;letter-spacing:.34em;text-transform:uppercase}

/* copertina */
.cov{padding:0;display:block}
.cov .photo{position:absolute;left:0;top:0;right:0;height:445px;overflow:hidden}
.cov .photo img{width:100%;height:100%;object-fit:contain}
.cov .sage{position:absolute;left:56px;top:445px;width:120px;height:14px;background:var(--sage)}
.cov h1{position:absolute;left:56px;width:600px;top:520px;font-weight:200;font-size:62px;line-height:1.03;letter-spacing:-.03em;text-wrap:balance}
.cov .cp{position:absolute;left:56px;top:720px;width:470px;font-size:14px;line-height:1.6;color:#4b4f4b}
.cov .sub{position:absolute;left:56px;bottom:56px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mid);line-height:1.8}
.cov .lg{position:absolute;right:56px;bottom:50px;height:112px}
.cov .lg img{height:112px;width:auto}
/* quarta */
.bck{padding:0;display:block;background:var(--ink)}
.bck .tile{position:absolute;left:197px;top:300px;width:400px;height:300px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.bck .tile img{width:320px;height:auto}
.bck .web{position:absolute;left:0;right:0;top:650px;text-align:center;color:var(--paper);font-size:18px;font-weight:300;letter-spacing:.12em}
.bck .bar{position:absolute;left:337px;top:620px;width:120px;height:12px;background:var(--sage)}
/* blocchi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;flex:none}
.cyc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;flex:none}
.cyc div{background:var(--stone);padding:12px 12px 14px;font-size:11px;line-height:1.45}
.cyc b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:6px}
.dt{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:11px;margin-top:10px}
.dt dt{color:var(--mid);letter-spacing:.04em}
.dt dd{margin:0}
.gran{background:var(--stone);padding:16px 18px 14px;margin-top:14px;flex:none}
.gran h4{font-weight:500;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid)}
.gl{display:flex;align-items:center;gap:12px;margin-top:8px}
.gl b{width:60px;font-weight:500;font-size:12px;letter-spacing:.08em}
.gl .tr{flex:1;height:10px;background:var(--paper)}
.gl .tr i{display:block;height:100%;background:var(--sage)}
.gl span{width:64px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
.ph1{position:relative;overflow:hidden;background:var(--stone)}
.ph1 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pa{position:relative;line-height:0;background:var(--stone)}
.pa img{width:100%;height:auto}
.ph1 figcaption{display:none!important;position:absolute;left:0;bottom:0;background:rgba(247,246,242,.92);padding:4px 9px;font-size:9px;letter-spacing:.08em;color:#3d413e}
/* pitture */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:9px;margin-top:20px;flex:1;min-height:0}
.pc{padding:14px;background:var(--stone);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pc .lgp{height:46px;display:flex;align-items:center}
.pc .lgp img{max-height:46px;max-width:100%;width:auto;height:auto}
.pc .pt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);margin-top:10px;font-weight:500}
.pc .pd{font-size:11px;line-height:1.45;margin-top:5px;color:#3d413e;flex:1}
.pc .pimg{height:96px;display:flex;align-items:center;justify-content:center}
.pc .pimg img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.pc.empty{background:var(--paper);outline:1.5px dashed #c4c2b8;outline-offset:-1.5px;align-items:center;justify-content:center;text-align:center;gap:4px;color:#a3a69f}
.pc.empty b{font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.pc.empty span{font-size:10px}
.pc.intro{background:var(--sage);color:var(--paper);justify-content:flex-end}
.pc.intro .pn{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.pc.intro .pd{flex:none;color:var(--paper)}
/* applicazioni */
.app{display:flex;flex-direction:column;gap:7px;margin-top:14px;flex:1;min-height:0}
.ap{display:flex;gap:16px;flex:1;min-height:0}
.ap .im{width:200px;flex:none;position:relative;overflow:hidden;background:var(--stone)}
.ap .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ap .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ap h3{font-weight:300;font-size:18px;letter-spacing:-.01em}
.ap p{font-size:11.5px;line-height:1.45;color:#3d413e}
.ap .pl{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ap .pl span{background:var(--stone);padding:3px 8px;font-size:9.5px;letter-spacing:.08em}
/* progetti */
.pj{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;margin-top:16px;flex:1;min-height:0}
/* area tecnica */
.at{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-top:6px}
.at a,.at div{display:flex;justify-content:space-between;gap:10px;background:var(--stone);padding:6px 12px;font-size:11px}
.at b{font-weight:500}
.at em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:600;white-space:nowrap}
.at .off em{color:#a3a69f}
/* cementi e quarzi */
.cqg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:20px}
.cq{display:flex;flex-direction:column;gap:4px}
.cqi{height:186px;background:var(--stone);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.cqi img{height:100%;width:auto;max-width:100%;object-fit:contain}
.cq b{font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3}
.cq p{font-size:11px;line-height:1.45;color:#3d413e}
.cq .fm{font-size:10.5px;color:var(--mid)}
/* contatti */
.ct2{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.ct2 div{background:var(--stone);padding:14px 20px;display:flex;gap:20px;align-items:baseline}
.ct2 em{font-style:normal;width:92px;flex:none;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:500}
.ct2 b{font-weight:300;font-size:18px;letter-spacing:-.005em}
.ct2 small{font-size:11px;color:#4b4f4b}
.soc{display:flex;gap:10px;align-items:center}
.soc svg{width:20px;height:20px;flex:none}

/* pagine dense e tabella */
.pg.dense .rows{gap:4px;margin-top:8px}
.pg.dense .pr{min-height:50px;gap:14px}
.pg.dense .lgt{width:150px;padding:5px 10px}
.pg.dense .lgt img{max-height:34px}
.pg.dense .lgt.ph{width:112px;padding:0}
.pg.dense .lgt.ph img{max-height:none}
.pg.dense .ds p{font-size:10.8px;line-height:1.36}
.pg.dense .ds{gap:2px}
.pg.dense .lgt:not(.ph) ~ .ds .tp{display:none}
.pg.dense .grp{margin-top:12px}
.mt{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
.mt th,.mt td{padding:6px 10px;text-align:left;background:var(--stone);border-bottom:3px solid var(--paper)}
.mt th{font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.mt td:first-child{color:var(--mid)}
/* note e quarta */
.nl{flex:1;margin-top:20px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#d6d3ca 35px,#d6d3ca 36px);background-position:0 0}
.bk{padding:0;display:block}
.bk .photo{position:absolute;left:0;top:0;right:0;height:445px;overflow:hidden}
.bk .photo img{width:100%;height:100%;object-fit:contain}
.bk .sage{position:absolute;left:56px;top:445px;width:120px;height:14px;background:var(--sage)}
.bk h1{position:absolute;left:56px;width:600px;top:520px;font-weight:200;font-size:54px;line-height:1.03;letter-spacing:-.03em}
.bk .cp{position:absolute;left:56px;top:612px;width:440px;font-size:14px;line-height:1.6;color:#4b4f4b}
.bk .co{position:absolute;left:56px;bottom:50px;display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.5;color:#3d413e;letter-spacing:.02em}
.bk .co b{font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);margin-bottom:4px}
.bk .co .gap{margin-top:8px}
.bk .soc2{display:flex;align-items:center;gap:7px}
.bk .soc2 svg{width:15px;height:15px;flex:none;color:var(--sage)}
.bk .lg{position:absolute;right:56px;bottom:50px;height:112px}
.bk .lg img{height:112px;width:auto}
.lgt.ph img[src*=secchio_foto]{width:84px;margin:auto}
.bkv{display:grid;grid-template-columns:410px 1fr;gap:20px;align-items:end;margin-top:6px}
.bkt{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;background:#f1efe9;padding:10px 12px 6px}
.bkt figure{margin:0;text-align:center}.bkt img{display:block;width:auto;margin:auto}
.bkt figcaption{font-size:8px;letter-spacing:.12em;color:#4b4f4b;margin-top:3px}
.bkv .ds{align-self:center}
/* swatch */
.swg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px 6px;margin-top:6px}
.sw{font-size:8px;line-height:1.25;color:#3d413e}
.sw img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eceae3}
.sw b{display:block;font-weight:500;margin-top:2px}.sw span{color:#7a7e77}
/* drenante */
.dsrow{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:6px;align-items:start}
.dsrow .pa{margin:0}.dsrow .pa img{width:100%;height:auto;display:block}
.swg.g4{grid-template-columns:repeat(4,1fr)}
/* colori microk */
.colp{flex:1;display:flex;justify-content:center;align-items:flex-start;margin-top:6px}
.colp img{height:900px;width:auto;display:block}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  #app{display:none}
  #print{display:block}
  #print .pg{break-after:page;page-break-after:always;box-shadow:none}
}
</style>

<div id="app">
  <div id="stage"><div id="fit"><div id="scaler"><div id="book"></div><div id="single"></div></div></div></div>
  <div id="bar">
    <button id="prev" type="button" aria-label="Pagina precedente">&larr; Indietro</button>
    <div id="count" aria-live="polite"></div>
    <button id="next" type="button" aria-label="Pagina successiva">Avanti &rarr;</button>
  </div>
</div>
<div id="print"></div>

<script>
(function(){
var SU='https://www.ekoscoatings.it/schede/';
var DSG=[['ambra', 'Ambra'], ['azzurro', 'Azzurro'], ['blu', 'Blu'], ['ebano', 'Ebano'], ['rosso', 'Rosso'], ['trasparente', 'Trasparente'], ['verde', 'Verde'], ['viola', 'Viola']];var DSP=[['arabescato', 'Arabescato', '2/5 · 5/7'], ['aurora', 'Aurora', '2/4 · 4/7'], ['bardiglio', 'Bardiglio', '2/4 · 4/7'], ['bianco-carrara', 'Bianco Carrara', '2/4 · 4/7'], ['bianco-verona', 'Bianco Verona', '2/4 · 4/7'], ['botticino', 'Botticino', '2/4 · 4/7'], ['brown-royal', 'Brown Royal', '2/4 · 4/7'], ['garda-grey', 'Garda Grey', '2/4 · 4/7'], ['giallo-mori', 'Giallo Mori', '2/4 · 4/7'], ['giallo-siena', 'Giallo Siena', '2/4 · 4/7'], ['grigio-carnico', 'Grigio Carnico', '2/4 · 4/7'], ['grigio-cielo', 'Grigio cielo', '2/4 · 4/7'], ['grigio-platino', 'Grigio platino', '2/4 · 4/7'], ['marrone-mogano', 'Marrone mogano', '2/5 · 5/7'], ['nero-ebano', 'Nero ebano', '2/4 · 4/7'], ['rosa-corallo', 'Rosa corallo', '2/4 · 4/7'], ['rosa-del-garda', 'Rosa del Garda', '2/4 · 4/7'], ['rosso-verona', 'Rosso Verona', '2/4 · 4/7'], ['silver', 'Silver', '2/5 · 5/7'], ['thassos', 'Thassos', '2/4 · 4/7'], ['verde-alpi', 'Verde alpi', '2/5 · 5/7']];
function sw(l,p,k){return '<div class="sw"><img src="img/ds/'+p+'-'+l[0]+'.jpg" alt=""><b>'+l[1]+'</b>'+(l[2]?'<span>'+l[2]+'</span>':'')+'</div>';}
function I(f,c){return '<img src="img/'+f+'" alt="" loading="eager"'+(c?' class="'+c+'"':'')+'>';}
function schl(s){return '';}
/* o: n nome, lg logo, dk fondo scuro, wm wordmark html, im foto tile, t tipo, d descrizione, f formati, s scheda */
function pr(o){
  var tile=o.lg?'<div class="lgt'+(o.dk?' dk':'')+'">'+I(o.lg)+'</div>':o.wm?'<div class="lgt">'+o.wm+'</div>':o.im?'<div class="lgt ph">'+I(o.im)+'</div>':'<div class="lgt"><span class="nmx">'+o.n+'</span></div>';
  return '<div class="pr'+(o.big?' big':'')+'" style="'+(o.h?'min-height:'+o.h+'px':'')+'">'+tile+'<div class="ds">'+(o.t?'<span class="tp">'+o.n+' · '+o.t+'</span>':'<span class="tp">'+o.n+'</span>')+'<p>'+o.d+'</p>'+(o.f?'<span class="fm">'+o.f+'</span>':'')+schl(o.s)+'</div></div>';
}
function head(ey,t,l){return '<div class="hd"><div class="eyebrow">'+ey+'</div><h2 class="ttl">'+t+'</h2>'+(l?'<p class="lead">'+l+'</p>':'')+'</div>';}

var N=P.length, leaves=N/2;
var book=document.getElementById('book'), single=document.getElementById('single'), fit=document.getElementById('fit'), scaler=document.getElementById('scaler');
var cnt=document.getElementById('count'), prev=document.getElementById('prev'), next=document.getElementById('next');
document.getElementById('print').innerHTML=P.join('');

for(var i=0;i<leaves;i++){
  var lf=document.createElement('div'); lf.className='leaf'; lf.style.zIndex=leaves-i;
  lf.innerHTML='<div class="face front">'+P[2*i]+'</div><div class="face back">'+P[2*i+1]+'</div>';
  book.appendChild(lf);
}
var L=[].slice.call(book.querySelectorAll('.leaf'));
var flipped=0, cur=0, mode='';

function layout(){
  var narrow=window.innerWidth<900;
  var st=document.getElementById('stage'), aw=st.clientWidth, ah=st.clientHeight, s;
  if(narrow){
    mode='single'; book.style.display='none'; single.style.display='block';
    s=Math.min(aw/794,ah/1122); fit.style.width=794*s+'px'; fit.style.height=1122*s+'px';
    single.style.width='794px'; single.style.height='1122px';
    showSingle(false);
  }else{
    mode='book'; single.style.display='none'; book.style.display='block';
    s=Math.min(aw/1588,ah/1122); fit.style.width=1588*s+'px'; fit.style.height=1122*s+'px';
    applyBook(false);
  }
  scaler.style.transform='scale('+s+')';
  updateUI();
}
function applyBook(anim){
  L.forEach(function(lf,i){
    var f=i<flipped; lf.classList.toggle('flipped',f);
    var z=f?i+1:leaves-i;
    if(anim){setTimeout(function(){lf.style.zIndex=z;},430);}else{lf.style.zIndex=z;}
  });
  var off=flipped===0?-397:(flipped===leaves?397:0);
  book.style.transform='translateX('+off+'px)';
}
var dir=1;
function showSingle(anim){
  single.innerHTML=P[cur];
  var pgEl=single.firstChild;
  if(anim){pgEl.style.transformOrigin=(dir>0?'left':'right')+' center';pgEl.animate([{opacity:.2,transform:'perspective(1800px) rotateY('+(dir>0?'':'-')+'70deg)'},{opacity:1,transform:'none'}],{duration:480,easing:'ease-out'});}
}
function updateUI(){
  if(mode==='book'){
    var l=flipped===0?'Copertina':(flipped===leaves?'Quarta di copertina':'Pagine '+(2*flipped)+'–'+(2*flipped+1));
    cnt.textContent=l; prev.disabled=flipped===0; next.disabled=flipped===leaves;
  }else{
    cnt.textContent='Pagina '+(cur+1)+' di '+N; prev.disabled=cur===0; next.disabled=cur===N-1;
  }
}
function go(d){
  if(mode==='book'){var n=Math.max(0,Math.min(leaves,flipped+d)); if(n===flipped)return; flipped=n; applyBook(true);}
  else{var c=Math.max(0,Math.min(N-1,cur+d)); if(c===cur)return; dir=d; cur=c; showSingle(true);}
  updateUI();
}
function goPage(p){
  if(mode==='book'){flipped=(p%2===1)?(p+1)/2:p/2; applyBook(true);}
  else{cur=p; showSingle(true);}
  updateUI();
}
prev.onclick=function(){go(-1)}; next.onclick=function(){go(1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='Enter'&&document.activeElement&&document.activeElement.hasAttribute('data-goto')){goPage(+document.activeElement.getAttribute('data-goto'));}});
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-goto]'); if(a){goPage(+a.getAttribute('data-goto'));}});
(function(){var x0=null,y0=0,st=document.getElementById('stage')||document.body;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1);}},{passive:true});
document.addEventListener('click',function(e){if(e.target.closest&&(e.target.closest('button')||e.target.closest('[data-goto]')||e.target.closest('a')))return;var pgEl=e.target.closest&&e.target.closest('.pg');if(!pgEl)return;var r=pgEl.getBoundingClientRect();go((e.clientX-r.left)>r.width/2?1:-1);});
})();

var tx=null;
document.getElementById('stage').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.getElementById('stage').addEventListener('touchend',function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>40)go(d<0?1:-1);});
window.addEventListener('resize',layout);
layout();
})();
</script>
